name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BLUEPREMIUM_VERSION_CODE: ${{ github.run_number }}
      BLUEPREMIUM_VERSION_NAME: "1.1.${{ github.run_number }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Fetch fixed signing material with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl -fsSL             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bluepremium-signing")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")"

          SIGNING_JSON="$(curl -fsSL             -H "Authorization: Bearer $OIDC_TOKEN"             "https://bluepremium.hazhanhasani4268-0f9.workers.dev/api/build/android-signing")"

          python3 - <<'PY'
          import base64, json, os, pathlib
          data = json.loads(os.environ["SIGNING_JSON"])
          if not data.get("ok"):
              raise SystemExit("Signing material unavailable")
          path = pathlib.Path("/tmp/bluepremium-release.jks")
          path.write_bytes(base64.b64decode(data["keystore_base64"]))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"BLUEPREMIUM_KEYSTORE={path}\n")
              env.write(f"BLUEPREMIUM_STORE_PASSWORD={data['store_password']}\n")
              env.write(f"BLUEPREMIUM_KEY_ALIAS={data['key_alias']}\n")
              env.write(f"BLUEPREMIUM_KEY_PASSWORD={data['key_password']}\n")
              env.write(f"BLUEPREMIUM_CERT_SHA256={data['cert_sha256']}\n")
          PY
      - name: Build stable release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$BLUEPREMIUM_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          echo "Stable signing certificate verified."

      - uses: actions/upload-artifact@v4
        with:
          name: bluepremium-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
